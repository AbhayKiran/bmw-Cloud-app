apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmw-frontend
  namespace: default
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: bmw-frontend
  template:
    metadata:
      labels:
        app: bmw-frontend
    spec:
      containers:
      - name: frontend
        image: 699960288562.dkr.ecr.ap-south-1.amazonaws.com/bmw-frontend:8cbb385b98143f82aacde0d75a8df08184ea4a55
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bmw-frontend-service
  namespace: default
spec:
  selector:
    app: bmw-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
