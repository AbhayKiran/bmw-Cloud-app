stages:
  - build

variables:
  AWS_DEFAULT_REGION: "ap-south-1"
  ECR_REGISTRY: "699960288562.dkr.ecr.ap-south-1.amazonaws.com"
  AWS_ROLE_ARN: "arn:aws:iam::699960288562:role/GitLabCI-OIDCRole"

default:
  id_tokens:
    AWS_JWT_TOKEN:
      aud: "https://gitlab.com"

build_and_push:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache aws-cli
    
    # GAP A SOLVED: Dynamically exchange GitLab token for temporary AWS credentials (OIDC)
    - >
      ASSUME_ROLE_OUTPUT=$(aws sts assume-role-with-web-identity \
        --role-arn $AWS_ROLE_ARN \
        --role-session-name "GitLabCISession" \
        --web-identity-token $AWS_JWT_TOKEN \
        --duration-seconds 3600 \
        --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" \
        --output text)
        
    - export AWS_ACCESS_KEY_ID=$(echo $ASSUME_ROLE_OUTPUT | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo $ASSUME_ROLE_OUTPUT | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo $ASSUME_ROLE_OUTPUT | awk '{print $3}')

    # Log into AWS ECR
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

  script:
    # GAP B SOLVED: Build and push Backend using Git Commit SHA + latest tag
    - echo "Building backend with commit SHA: $CI_COMMIT_SHA"
    - docker build -t $ECR_REGISTRY/bmw-backend:$CI_COMMIT_SHA -t $ECR_REGISTRY/bmw-backend:latest ./backend
    - docker push $ECR_REGISTRY/bmw-backend:$CI_COMMIT_SHA
    - docker push $ECR_REGISTRY/bmw-backend:latest

    # Build and push Frontend using Git Commit SHA + latest tag
    - echo "Building frontend with commit SHA: $CI_COMMIT_SHA"
    - docker build -t $ECR_REGISTRY/bmw-frontend:$CI_COMMIT_SHA -t $ECR_REGISTRY/bmw-frontend:latest ./frontend
    - docker push $ECR_REGISTRY/bmw-frontend:$CI_COMMIT_SHA
    - docker push $ECR_REGISTRY/bmw-frontend:latest
