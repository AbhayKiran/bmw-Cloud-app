image: docker:latest

services:
  - docker:dind

stages:
  - build
  - deploy

build_and_push:
  stage: build
  id_tokens:
    AWS_JWT_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache aws-cli curl bash
  script:
    - echo "Assuming IAM Role via OIDC..."
    - CREDENTIALS=$(aws sts assume-role-with-web-identity --role-arn ${AWS_ROLE_ARN} --role-session-name "GitLabCI-Session-${CI_COMMIT_SHA}" --web-identity-token "${AWS_JWT_TOKEN}" --duration-seconds 3600 --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
    - export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
    
    # Login to Amazon ECR
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
    
    # Build and Push Backend
    - docker build -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-backend:$CI_COMMIT_SHA -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-backend:latest ./backend
    - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-backend:$CI_COMMIT_SHA
    - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-backend:latest
    
    # Build and Push Frontend
    - docker build -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-frontend:$CI_COMMIT_SHA -t ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-frontend:latest ./frontend
    - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-frontend:$CI_COMMIT_SHA
    - docker push ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/bmw-frontend:latest

deploy_to_eks:
  stage: deploy
  image: alpine/k8s:1.30.2
  id_tokens:
    AWS_JWT_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache aws-cli
  script:
    - echo "Assuming IAM Role via OIDC for EKS deployment..."
    - CREDENTIALS=$(aws sts assume-role-with-web-identity --role-arn ${AWS_ROLE_ARN} --role-session-name "GitLabCI-Deploy-${CI_COMMIT_SHA}" --web-identity-token "${AWS_JWT_TOKEN}" --duration-seconds 3600 --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]" --output text)
    - export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
    - export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
    - export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')

    # Update kubeconfig to connect to your EKS cluster (replace 'bmw-cluster' with your actual cluster name if different)
    - aws eks update-kubeconfig --region ${AWS_DEFAULT_REGION} --name bmw-dev-cluster

    # Dynamically inject the commit SHA into the deployment manifests
    - sed -i "s|__IMAGE_TAG__|$CI_COMMIT_SHA|g" k8s/backend-deployment.yaml
    - sed -i "s|__IMAGE_TAG__|$CI_COMMIT_SHA|g" k8s/frontend-deployment.yaml

    # Apply Kubernetes Manifests
    - kubectl apply -f k8s/
